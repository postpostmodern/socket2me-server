upstream socket2me_pool {
  hash $host consistent; # stick by subdomain/host
  server 127.0.0.1:5050;
  server 127.0.0.1:5051;
  server 127.0.0.1:5052;
  server 127.0.0.1:5053;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 443 ssl;
  server_name ~^(?<user>[^.]+)\.socket2me\.dev$;

  # ... ssl certs ...

  # Keep this in sync with the app's S2M_MAX_BODY (default 10MB). Without an
  # explicit value nginx defaults to 1MB and will reject larger requests
  # before they ever reach the app.
  client_max_body_size 10m;

  location / {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # $user comes from the validated server_name capture above. proxy_set_header
    # OVERWRITES any client-supplied X-S2M-Username, so a caller cannot spoof it
    # through nginx. The app trusts this header, so it must only ever be set here
    # and the app must never be reachable except via nginx (bind 127.0.0.1 + ufw).
    proxy_set_header X-S2M-Username $user;

    proxy_read_timeout 3600; # ws long-lived
    proxy_send_timeout 3600;

    proxy_pass http://socket2me_pool;
  }
}
